<!DOCTYPE html>
<html>
<head>
  <title>Regina/Polyphon Disc Converter</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>Regina/Polyphon Disc Converter</h1>
  <h2>NOTE: ONLY 15.5" DISCS AT THE MOMENT</h2>
  <p>Convert images of Regina/Polyphon 15.5" Discs into downloadable/playable MIDI files</p>
  <p>Make sure the image is clear and straight-on. Dark backgrounds, black especially, are HIGHLY recommended.</p>

  <label for="scanMode">Scan Mode:</label>

<select id="scanMode">
    <option value="automatic">Automatic Detection</option>
    <option value="color">Manual Color Detection</option>
    <option value="manual">Manual Hole Selection</option>
</select>


<div id="colorControls" style="display: none;">
  <label for="holeColor">Hole Color:</label>
  <input type="color" id="holeColor" value="#00ff00">
  <label for="colorTolerance">Color Tolerance:</label>
  <input type="range" id="colorTolerance" min="0" max="255" value="60">
  <span id="colorToleranceValue">60</span>
</div>

  
  <input type="file" id="imageUpload">

  <br><br>

  <div id="workspace">
    <img id="discImage" width="800">
    <canvas id="discCanvas"></canvas>
    <div id="edgeGuide">
      <div id="edgeLine"></div>
    </div>
    <div id="startGuide">
      <div id="startLine"></div>
      <div id=rotationHandle></div>
    </div>
    <div id="centerDot"></div>
  </div>
  <button id="scanDisc">Scan Disc</button>

  <label for="sensitivity">Detection Sensitivity:</label>

<input
  type="range"
  id="sensitivity"
  min="0"
  max="255"
  value="100"
>

<span id="sensitivityValue">100</span>
  
  <script src="script.js"></script>
  
</body>
</html>
